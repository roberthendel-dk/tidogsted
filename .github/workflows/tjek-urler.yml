# Tjekker URL'erne i opgave/ekstra-urler.xlsx – gratis, uden Claude.
# Kører hver morgen før Claude-søgningerne, og med det samme når du uploader et nyt ark.
name: Tjek URL'er

on:
  schedule:
    - cron: "40 2 * * *"   # 02.40 UTC = 03.40 dansk vintertid (04.40 sommertid)
  push:
    branches: [main]
    paths: ["opgave/ekstra-urler.xlsx", "opgave/faste-arrangementer.xlsx", "opgave/undtagelser.xlsx", "scripts/**", "lib/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tjek-urler
  cancel-in-progress: false

jobs:
  tjek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tjek URL'erne
        run: node scripts/tjek-urler.mjs
      - name: Gem resultatet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Ingen ændringer"; exit 0; fi
          git commit -m "URL-tjek $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
