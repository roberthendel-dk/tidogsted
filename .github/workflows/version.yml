# Skriver versionsnummeret (antal opdateringer af selve appen) til version.json,
# så "Version X, udviklet af RH" under titlen altid passer.
name: Versionsnummer

on:
  push:
    branches: [main]
    paths: ["index.html", "lib/**", "functions/**", "worker.js", "version-basis.json"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tæl opdateringer
        run: |
          n=$(git rev-list --count HEAD -- index.html lib functions worker.js)
          hoved=$(jq -r '.hoved // 1' version-basis.json); fra=$(jq -r '.fra // 0' version-basis.json)
          v="$hoved.$((n - fra))"
          printf '{"version":"%s","opdateringer":%s,"opdateret":"%s","commit":"%s"}\n' "$v" "$n" "$(date -u +%FT%TZ)" "$(git rev-parse --short HEAD)" > version.json
          cat version.json
      - name: Gem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Version $(jq -r .version version.json)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
